// Minimal RFC4180-style CSV parser: handles quoted fields, commas and
// newlines inside quotes, and "" as an escaped quote. Good enough for
// Google Sheets' own CSV export.
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    } else {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter((r) => r.some((cell) => cell.trim() !== ""));
}

// Looks up a column by the start of its header text, ignoring case and
// anything appended after it (e.g. a column literally named "Cover Image
// URL (225x340)" still matches findField(row, "Cover Image URL")). Makes
// the site tolerant of the sheet owner editing header wording/notes.
function findField(row, baseName) {
  const target = baseName.trim().toLowerCase();
  const key = Object.keys(row).find((k) => k.trim().toLowerCase().startsWith(target));
  return key ? row[key] : undefined;
}

async function fetchSheetRows(url) {
  if (!url) return [];
  const res = await fetch(url);
  const text = await res.text();
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const header = rows[0].map((h) => h.trim());
  return rows.slice(1).map((r) => {
    const obj = {};
    header.forEach((h, i) => (obj[h] = (r[i] || "").trim()));
    return obj;
  });
}

// Fetches every row of a published Google Sheet tab. Falls back to the
// hardcoded defaults above until SHEET_CSV_URLS has a real link for it.
function useSheetList(url, fallback, mapRow = (d) => d) {
  const [items, setItems] = useState(fallback);
  useEffect(() => {
    let cancelled = false;
    fetchSheetRows(url)
      .then((rows) => {
        if (cancelled || rows.length === 0) return;
        setItems(rows.map(mapRow));
      })
      .catch(() => {});
    return () => {
      cancelled = true;
    };
  }, [url]);
  return items;
}

// Fetches the first data row of a published Google Sheet tab (e.g. bio, contact info).
function useSheetSingle(url, fallback, mapRow = (d) => d) {
  const [data, setData] = useState(fallback);
  useEffect(() => {
    let cancelled = false;
    fetchSheetRows(url)
      .then((rows) => {
        if (cancelled || rows.length === 0) return;
        setData({ ...fallback, ...mapRow(rows[0]) });
      })
      .catch(() => {});
    return () => {
      cancelled = true;
    };
  }, [url]);
  return data;
}

function Reveal({ as: As = "div", className = "", delay = 0, children, ...rest }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const node = ref.current;
    if (!node) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            obs.unobserve(node);
          }
        });
      },
      { threshold: 0.15 }
    );
    obs.observe(node);
    return () => obs.disconnect();
  }, []);

  return (
    <As
      ref={ref}
      className={`reveal ${visible ? "reveal-visible" : ""} ${className}`}
      style={{ transitionDelay: `${delay}ms` }}
      {...rest}
    >
      {children}
    </As>
  );
}

function parseHash() {

  return { page: "home", bookIndex: null };
}

function App() {
  const [route, setRoute] = useState(parseHash());
  const page = route.page;

  const bio = useSheetSingle(SHEET_CSV_URLS.bio, DEFAULT_BIO, (row) => ({
    name: findField(row, "Name"),
    bioText: findField(row, "Bio"),
    photo: findField(row, "Photo URL"),
  }));
  const projects = useSheetList(SHEET_CSV_URLS.projects, DEFAULT_PROJECTS, (row) => ({
    title: findField(row, "Project Title"),
    desc: findField(row, "Project Description"),
    img: findField(row, "Project Image URL") || null,
  }));
  const news = useSheetList(SHEET_CSV_URLS.news, DEFAULT_NEWS, (row) => ({
    title: findField(row, "News Title"),
    desc: findField(row, "News Description"),
    img: findField(row, "News Image URL") || null,
  }));
  const books = useSheetList(SHEET_CSV_URLS.books, DEFAULT_BOOKS, (row) => ({
    title: findField(row, "Book Title"),
    img: findField(row, "Cover Image URL"),
    desc: findField(row, "Book Description") || "",
    price: findField(row, "Price") || "",
    buyUrl: findField(row, "Buy URL") || "",
  }));
  const contact = useSheetSingle(SHEET_CSV_URLS.contact, DEFAULT_CONTACT, (row) => {
    const socialsRaw = row["Social platforms (comma separated)"] || "";
    const socials = socialsRaw
      .split(",")
      .map((s) => s.trim())
      .filter(Boolean)
      .map((label) => ({ label }));
    return {
      email: row["Email"],
      agentEmail: row["Agent email"],
      socials: socials.length > 0 ? socials : DEFAULT_CONTACT.socials,
    };
  });

  useEffect(() => {
    const onHashChange = () => setRoute(parseHash());
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  const navigate = (id) => {
    window.location.hash = id;
    setRoute({ page: id, bookIndex: null });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const openBook = (index) => {
    window.location.hash = `book-${index}`;
    setRoute({ page: "book-detail", bookIndex: index });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const currentBook = page === "book-detail" ? books[route.bookIndex] : null;

  let content;
  if (page === "home") content = <HomePage bio={bio} />;
  else if (page === "projects") content = <ListPage items={projects} />;
  else if (page === "books") content = <BooksPage items={books} onNavigate={navigate} onOpenBook={openBook} />;
  else if (page === "news") content = <ListPage items={news} />;
  else if (page === "book-detail" && currentBook)
    content = <BookDetailPage book={currentBook} onNavigate={navigate} />;
  else if (page === "book-detail")
    content = <BooksPage items={books} onNavigate={navigate} onOpenBook={openBook} />;
  else content = <ContactPage contact={contact} />;

  const navAtBottom = page === "home";
  const mainKey = page === "book-detail" ? `book-${route.bookIndex}` : page;

  return (
    <div className="app">
      <Hero key={`hero-${page}`} />
      {!navAtBottom && <Nav page={page} onNavigate={navigate} />}
      <main key={mainKey}>{content}</main>
      {navAtBottom && <Nav page={page} onNavigate={navigate} bottom />}
      <footer>
        <p>© 2026 Yulia Aslanova. All rights reserved</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
